name: Service Monitoring

on:
  repository_dispatch:
    types: [trigger-monitor]
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Monitor
        env:
          WORKER_URL: 'https://fcctp-status.fcctp.workers.dev'
          TEST_TOKEN: ${{ secrets.MONITOR_TEST_TOKEN }}
        run: node scripts/run-monitor.js
